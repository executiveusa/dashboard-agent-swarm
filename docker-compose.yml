version: "3.9"
services:
  flowise:
    image: flowiseai/flowise:latest
    # or build locally with the upstream Dockerfile
    # build: ./vendor/flowise
    container_name: flowise
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - VITE_PORT=${VITE_PORT:-5174}
      - PORT=3000
      - VITE_PORT=5174
    volumes:
      - ./data/flowise:/root/.flowise
    restart: unless-stopped
