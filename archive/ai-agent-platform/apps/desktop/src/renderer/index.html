<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lovable Desktop Shell</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 3rem 2rem;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 600px;
        text-align: center;
        line-height: 1.6;
      }
      code {
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        background: rgba(128, 128, 128, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lovable Desktop Shell</h1>
      <p>The desktop container could not reach the configured UI endpoint.</p>
      <p>
        Ensure the Next.js console is running locally and set
        <code>DESKTOP_UI_URL</code> to its address. The window will refresh
        automatically next time the application starts.
      </p>
    </main>
  </body>
</html>
