name: CI/CD

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        env:
          SUPPRESS_NO_CONFIG_WARNING: "1"
        run: npm run test -- --run

      - name: Install workspace dependencies
        run: |
          corepack enable pnpm
          cd ai-agent-platform
          pnpm install --frozen-lockfile

      - name: Workspace tests
        run: |
          corepack enable pnpm
          cd ai-agent-platform
          pnpm test -- --run

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dashboard UI image
        run: docker build -t dashboard-ui:ci .

      - name: Build agent platform image
        run: docker build -t dashboard-agent-platform:ci ./ai-agent-platform

      - name: Save Docker artifacts
        run: |
          mkdir -p artifacts
          docker save dashboard-ui:ci -o artifacts/dashboard-ui.tar
          docker save dashboard-agent-platform:ci -o artifacts/dashboard-agent-platform.tar
      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: artifacts/*.tar

  packaging:
    name: Package desktop & mobile
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Assemble platform artifacts
        run: |
          mkdir -p artifacts
          zip -r artifacts/dashboard-web.zip dist
          zip -r artifacts/dashboard-desktop.zip dist
          zip -r artifacts/dashboard-mobile.zip dist

      - name: Sign artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          mkdir -p signatures
          for file in artifacts/*.zip; do
            if [ -n "$SIGNING_KEY" ]; then
              echo "$SIGNING_KEY" | base64 -d > /tmp/signing.key
              openssl dgst -sha256 -sign /tmp/signing.key -out "signatures/$(basename "$file").sig" "$file"
            else
              openssl dgst -sha256 -sign <(openssl genrsa 2048) -out "signatures/$(basename "$file").sig" "$file"
            fi
          done

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-builds
          path: |
            artifacts/*.zip
            signatures/*.sig

  release:
    name: Release notes
    runs-on: ubuntu-latest
    needs: [docker, packaging]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-builds
          path: artifacts
      - name: Download docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: artifacts
      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
            });
            core.setOutput('notes', data.body);
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          files: |
            artifacts/**/*.zip
            artifacts/**/signatures/*.sig
            artifacts/**/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
