version: "3.9"

services:
  dashboard:
    build:
      context: ..
      target: runner
    image: lovable/dashboard:latest
    ports:
      - "8080:80"
    environment:
      - VITE_EDGE_BASE_URL=${EDGE_BASE_URL:-http://edge:8787}
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - frontend

  frontend:
    build:
      context: ../ai-agent-platform/apps/frontend
      target: runner
    image: lovable/frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_EDGE_URL=${EDGE_BASE_URL:-http://edge:8787}
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    depends_on:
      - edge

  edge:
    build:
      context: ../ai-agent-platform/apps/edge
      target: runner
    image: lovable/edge:latest
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OI_MODE=${OI_MODE:-local}
      - LOCAL_OI_PROXY_URL=http://local-runner:3333
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://lm-studio:1234/v1}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      - MCP_SOCKET=/var/run/mcp/edge.sock
    ports:
      - "8787:8787"
    volumes:
      - mcp-socket:/var/run/mcp
    depends_on:
      - local-runner
      - ollama

  local-runner:
    build:
      context: ../ai-agent-platform/apps/local-runner
      target: runner
    image: lovable/local-runner:latest
    environment:
      - LOCAL_OI_BROWSER_HEADLESS=1
      - LOCAL_OI_MAX_SESSIONS=4
    ports:
      - "3333:3333"
    volumes:
      - sandboxes:/sandboxes
      - mcp-socket:/var/run/mcp

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  lm-studio:
    image: lmstudio/lmstudio:latest
    command: ["--port", "1234"]
    ports:
      - "1234:1234"

volumes:
  sandboxes:
  ollama-data:
  mcp-socket:
